schema_version: 2
# instructions.yaml
#
# This is YOUR file — the tool only reads it, never writes to it.
# Applied/last-run state is tracked separately, in instruction-registry.yaml,
# so it's always safe to edit this file by hand.
#
# ─────────────────────────────────────────────────────────────────────────
# FIELD REFERENCE
# ─────────────────────────────────────────────────────────────────────────
#
#   name         Human-readable identifier for this instruction. Used in
#                generated code comments and error messages. Safe to rename
#                at any time — it's cosmetic only.
#
#   description  Free text. Not used by the tool, just for your own notes.
#
#   opclass      Either:
#                  - "custom"           → the tool generates a brand-new,
#                                         dedicated functional unit for this
#                                         instruction, using latency,
#                                         pipelined, and fu_count below.
#                  - an existing gem5 opclass (e.g. "IntALU", "FloatAdd")
#                                       → this instruction issues to gem5's
#                                         built-in unit. latency, pipelined,
#                                         and fu_count are NOT used in this
#                                         case — gem5's own timing and unit
#                                         count for that opclass apply. Omit
#                                         them entirely rather than setting
#                                         values that will be ignored.
#
#   latency      Cycles this instruction takes. Only used when opclass is
#                "custom".
#
#   pipelined    Whether the generated functional unit can accept a new
#                instruction before the previous one finishes. Only used
#                when opclass is "custom".
#
#   fu_count     Number of parallel instances of this instruction's
#                dedicated functional unit to generate — i.e. how many of
#                this instruction can be in flight (issued but not yet
#                complete) at the same time. Only used when opclass is
#                "custom". This does NOT enable sharing one functional unit
#                across different instructions — each instruction still gets
#                its own private unit(s); fu_count only controls how many
#                copies of that private unit exist. Defaults to 1 if omitted.
#
#   auto_manage  true  → the tool fully owns this entry's generated code in
#                        gem5. Editing this file and re-running the tool
#                        will update, or remove, the corresponding gem5-side
#                        code automatically.
#                false → the tool will not touch this entry's gem5-side code
#                        at all, even if you change this file. Use this for
#                        anything you've hand-modified in gem5 that you don't
#                        want the tool to overwrite.
#
# ─────────────────────────────────────────────────────────────────────────
# EXAMPLES
# ─────────────────────────────────────────────────────────────────────────

riscv_instructions:

  # Example 1: brand-new custom instruction with its own dedicated FU(s).
  # latency/pipelined/fu_count apply here because opclass is "custom".
  - name: "hardware_extension"
    description: "Custom hardware extension"
    opclass: "Custom"
    latency: 22
    fu_count: 1
    pipelined: true
    auto_manage: false

  # Example 2: instruction that reuses gem5's built-in IntALU timing.
  # latency/pipelined/fu_count are omitted — IntALU's own timing and unit
  # count apply, so there's nothing for these fields to configure.
  - name: "special_ALU_instruction"
    description: "Special instruction part of IntALU class."
    opclass: "intalu"
    auto_manage: true


x86_instructions: